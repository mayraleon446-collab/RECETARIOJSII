<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Forkify Postres | Avance 3</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./src/css/style.css">
        <script type="module" src="./src/js/controller.js"></script>
    </head>
    <body>
        <main class="app-shell">
            <header class="header">
                <a class="brand" href="#">
                    <span class="brand__icon">🧁</span>
                    <span>
                        <strong>Forkify</strong>
                        <em>Postres</em>
                    </span>
                </a>
                <form class="search">
                    <span class="search__icon">⌕</span>
                    <input class="search__field" placeholder="Busca cake, chocolate, strawberry…">
                    <button class="search__btn" type="submit">Buscar</button>
                </form>
                <span class="stage-pill">Avance 3</span>
            </header>
            <section class="intro intro--compact">
                <div>
                    <span class="eyebrow">BÚSQUEDA · VISTAS · EVENTOS</span>
                    <h1>Busca tu siguiente antojo.</h1>
                    <p>La búsqueda ya funciona y los resultados se renderizan con vistas reutilizables.</p>
                </div>
            </section>
            <section class="workspace">
                <aside class="results-panel">
                    <div class="results"></div>
                </aside>
                <section class="recipe" aria-live="polite">
                    <div class="message">
                        <div class="message__icon">🍓</div>
                        <h2>Busca un postre</h2>
                        <p>Prueba con cake, chocolate o strawberry.</p>
                    </div>
                </section>
            </section>
            <footer class="footer">
                <span>Forkify Postres</span>
                <span>Programación con JavaScript II · Avance 3</span>
            </footer>
        </main>
    </body>
</html>
